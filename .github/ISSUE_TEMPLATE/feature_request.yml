name: Feature request
description: Suggest an improvement for SXPE Beta.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome ideas. SXPE is a **public Beta**, not a full s3pe replacement yet — say which surface you care about (GUI / CLI / MCP).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like SXPE to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Workarounds, other tools, or “none yet”.
  - type: checkboxes
    id: parity
    attributes:
      label: Surfaces
      description: Where should this land first? (Parity across GUI / CLI / MCP is the goal when it fits.)
      options:
        - label: GUI
        - label: CLI
        - label: MCP
        - label: Docs only
