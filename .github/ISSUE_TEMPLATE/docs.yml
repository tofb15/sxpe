name: Documentation
description: Typo, unclear guide, or missing Beta docs.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: Point at a file or section if you can (`README`, `docs/user-guide.md`, …).
  - type: textarea
    id: what
    attributes:
      label: What should change?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Doc / URL (optional)
      placeholder: docs/user-guide.md#check-for-update
