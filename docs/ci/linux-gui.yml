# MAINTAINER-ONLY - not end-user documentation.
# Canonical paste-ready job: Linux Qt GUI build + gui_smoke (offscreen).
# docs/building.md links here; do not duplicate this YAML in markdown.
# Promote into .github/workflows/ci.yml (next to linux-cli / windows-gui) when the
# pushing token has the GitHub `workflow` scope. OAuth apps without that scope
# cannot update .github/workflows/* - see docs/building.md.
#
# Indent this job under `jobs:` in ci.yml (two spaces before linux-gui:).

  linux-gui:
    name: Linux GUI smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.2"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          archives: qtbase icu
          install-deps: true

      - name: Install ninja, CMake 3.28, ICU 73
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ wget
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.sh
          sudo sh cmake-3.28.6-linux-x86_64.sh --skip-license --prefix=/usr/local
          cmake --version
          g++ --version
          # Official Qt 6.8 gcc_64 links ICU 73; Ubuntu 24.04 ships ICU 74.
          if [ ! -e /usr/lib/x86_64-linux-gnu/libicui18n.so.73 ]; then
            wget -q http://old-releases.ubuntu.com/ubuntu/pool/main/i/icu/libicu73_73.2-1ubuntu2_amd64.deb \
              || wget -q http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu73_73.2-1ubuntu2_amd64.deb
            sudo dpkg -i libicu73_*.deb
          fi

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default --output-on-failure
