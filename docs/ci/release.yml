# MAINTAINER-ONLY — not end-user documentation.
# Paste-ready GitHub Actions workflow to build a Windows portable zip on version tags
# (v0.6.0, v1.0.0, …) and attach it to the Release. Prefer copying into
# .github/workflows/release.yml when the token has `workflow` scope.
# See docs/ci/README.md and docs/building.md.
#
# Optional later: add a linux-cli (or linux-gui) job that runs
#   ./scripts/package-linux.sh --skip-build
# and uploads dist/sxpe-*-linux-x64*.tar.gz alongside the Windows zip.
# Same workflow-scope constraint as promoting this file into .github/workflows/.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          archives: qtbase

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Package portable zip
        shell: pwsh
        run: |
          ./scripts/package.ps1 -BuildDir build -SkipBuild
          Get-ChildItem dist -Filter "*.zip" | ForEach-Object { $_.FullName }

      - name: Upload Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sxpe-*-windows-x64.zip
          generate_release_notes: true
          body_path: docs/releases/v0.6.0.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
